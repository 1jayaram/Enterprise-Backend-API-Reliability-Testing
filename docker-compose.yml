
services:
  db:
    image: postgres:16
    container_name: enterprise_api_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: enterprise_password
      POSTGRES_DB: workload_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_user -d workload_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
